name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: dist/*.exe
          - os: ubuntu-latest
            name: Linux
            artifact: dist/*.AppImage
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # videos are stored in Git LFS

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: OrangeBox-Launcher-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # Pushing a tag such as v0.1.0 publishes the builds as a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
